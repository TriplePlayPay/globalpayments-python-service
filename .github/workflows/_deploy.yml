# Reusable deploy workflow (per-repo copy — will be centralised later per ITPP-162).
# Called once per environment by the deploy-*.yaml callers.
#
# ECR consolidation (ITPP-317): every environment now builds into ONE shared repo,
# tpp-<service> in the TPP prod account (907119984749 / us-east-1). The environment is
# carried in the TAG, not in the repo path or the account:
#
#   tpp-global-payments:global-payments-<env>-1.0.0.<run_number>
#
# Two roles are needed because the image and the service live in different accounts:
#   ecr_role_arn -> prod account, used to push the image (all environments)
#   role_arn     -> the environment's own account, used to roll ECS
# dev/sandbox ECS pull the image cross-account; the repository policy and the task-exec role
# policies for that are already applied.
#
# Tags are IMMUTABLE in the shared repo, so a tag can never be overwritten. That is why the
# git-sha tag is gone: re-running a workflow on the same commit would try to push an existing
# tag and fail. github.run_number always moves, so the version tag is always new.
#
# Because the tag is fixed rather than moving, `force-new-deployment` can no longer pick up a
# new image — it would just re-pull the same tag. The deploy step therefore registers a new
# task-definition revision carrying the new image and points the service at it.
# NOTE: this needs `ignore_task_definition_changes = true` on the service in infrastructure-v2,
# otherwise the next terragrunt apply reverts the image. Pending Vikas (decision #23).
#
# The approval gate is enforced by GitHub Environments: only environment=production carries
# required reviewers. Auth is OIDC only (no static keys).

name: _deploy

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }            # dev | sandbox | production
      aws_region:  { type: string, required: true }            # region of the ECS service
      role_arn:    { type: string, required: true }            # environment's ECS deploy role
      ecr_role_arn: { type: string, required: true }           # prod-account role used to push
      registry:    { type: string, required: true }            # prod account ECR registry
      ecr_repo:    { type: string, required: true }            # shared repo: tpp-global-payments
      ecr_region:  { type: string, required: false, default: 'us-east-1' }
      image_tag:   { type: string, required: true }            # global-payments-<env>-1.0.0.<n>
      base_image:  { type: string, required: false, default: '' }   # optional Docker build-arg
      ecs_cluster: { type: string, required: false, default: '' }   # empty => skip ECS deploy
      ecs_service: { type: string, required: false, default: '' }

jobs:
  deploy:
    # Stays on the amd64 runner with a genuine multi-arch build: this service is X86_64 in
    # dev/sandbox but ARM64 in prod, so both platforms are required. The arm64 half is therefore
    # QEMU-emulated and can rarely deadlock (a sibling repo hung ~6h on 2026-07-31), hence the
    # timeout below. Once dev/sandbox move to ARM64 this can become a native single-platform build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment == 'production' && 'production' || '' }}
    concurrency:
      group: deploy-${{ inputs.environment }}-${{ github.repository }}
    permissions:
      id-token: write   # OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (enables the arm64 build on the amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx (multi-platform builder)
        uses: docker/setup-buildx-action@v3

      # ---- push phase: prod account ------------------------------------------------
      - name: Configure AWS credentials for ECR push (prod account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.ecr_role_arn }}
          aws-region: ${{ inputs.ecr_region }}

      - name: Confirm push identity
        run: aws sts get-caller-identity

      - name: Log in to the shared ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push (multi-arch amd64+arm64; ${{ inputs.image_tag }})
        run: |
          set -euo pipefail
          IMG="${{ inputs.registry }}/${{ inputs.ecr_repo }}"
          BASE_ARG=""
          if [ -n "${{ inputs.base_image }}" ]; then
            BASE_ARG="--build-arg BASE_IMAGE=${{ inputs.base_image }}"
          fi
          docker buildx build . \
            --platform=linux/amd64,linux/arm64 $BASE_ARG \
            --provenance=false \
            -t "$IMG:${{ inputs.image_tag }}" \
            --push

      - name: Record the pushed digest
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images \
            --region "${{ inputs.ecr_region }}" \
            --repository-name "${{ inputs.ecr_repo }}" \
            --image-ids imageTag="${{ inputs.image_tag }}" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "Pushed ${{ inputs.ecr_repo }}:${{ inputs.image_tag }} => $DIGEST"

      # ---- deploy phase: the environment's own account -----------------------------
      - name: Configure AWS credentials for ECS deploy (target account)
        if: ${{ inputs.ecs_cluster != '' && inputs.ecs_service != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Deploy to ECS (register a new task-def revision, then roll)
        if: ${{ inputs.ecs_cluster != '' && inputs.ecs_service != '' }}
        env:
          CLUSTER: ${{ inputs.ecs_cluster }}
          SERVICE: ${{ inputs.ecs_service }}
          REGION:  ${{ inputs.aws_region }}
          NEW_IMAGE: ${{ inputs.registry }}/${{ inputs.ecr_repo }}:${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          echo "== $SERVICE on $CLUSTER -> $NEW_IMAGE =="

          # The service's current task definition is the base we edit.
          TD_ARN=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
            --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --region "$REGION" --task-definition "$TD_ARN" \
            --query 'taskDefinition' > td.json

          # The load-balanced container is the service's primary one. Some services also run a
          # task-lifetime sidecar built from the SAME image, so every container currently using
          # the primary's image is updated together; sidecars on other images (the log router)
          # are left alone.
          PRIMARY=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
            --services "$SERVICE" --query 'services[0].loadBalancers[0].containerName' --output text)
          OLD_IMAGE=$(jq -r --arg C "$PRIMARY" \
            '.containerDefinitions[] | select(.name==$C) | .image' td.json)
          echo "primary container=$PRIMARY  old image=$OLD_IMAGE"

          # Drop the read-only fields describe-task-definition returns; register the rest.
          jq --arg OLD "$OLD_IMAGE" --arg NEW "$NEW_IMAGE" \
            '.containerDefinitions |= map(if .image == $OLD then .image = $NEW else . end)
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            td.json > td-new.json

          NEW_TD=$(aws ecs register-task-definition --region "$REGION" \
            --cli-input-json file://td-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered $NEW_TD"

          aws ecs update-service --region "$REGION" --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_TD" >/dev/null

          STATE=""
          for i in $(seq 1 60); do
            STATE=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
              --services "$SERVICE" --query 'services[0].deployments[0].rolloutState' --output text)
            echo "  [$i/60] rolloutState=$STATE"
            [ "$STATE" = "COMPLETED" ] && break
            [ "$STATE" = "FAILED" ] && { echo "rollout FAILED"; exit 1; }
            sleep 30
          done
          [ "$STATE" = "COMPLETED" ] || { echo "timed out after 30 min"; exit 1; }

          # A COMPLETED rollout is not proof the new revision is live — a circuit-breaker
          # rollback also reports COMPLETED. Assert the primary deployment is our revision.
          LIVE_TD=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" --output text)
          echo "live task definition = $LIVE_TD"
          [ "$LIVE_TD" = "$NEW_TD" ] || { echo "ROLLED BACK: live is $LIVE_TD, expected $NEW_TD"; exit 1; }
          echo "$SERVICE is live on $NEW_TD (image $NEW_IMAGE)"
