# Reusable deploy workflow (per-repo copy — will be centralised later per ITPP-162).
# Called once per environment by the deploy-*.yaml callers.
#
# ECR consolidation (ITPP-317): every environment now builds into ONE shared repo,
# tpp-<service> in the TPP prod account (907119984749 / us-east-1). The environment is
# carried in the TAG, not in the repo path or the account:
#
#   tpp-global-payments:global-payments-<env>-1.0.0.<run_number>
#
# The image is BUILT ONCE, by dev, and then promoted (decisions #4 and #26). Sandbox and prod do
# not rebuild — they add their own tag to the digest dev produced and deploy that. So the artifact
# that reaches production is literally the one that was tested, not a rebuild of the same commit.
# Container builds are not reproducible, so a rebuild genuinely differs: our own dev and sandbox
# base images, built ten seconds apart from identical source, have different digests.
#
#   merge -> dev builds  global-payments-dev-latest
#              -> sandbox promotes that digest as global-payments-sandbox-latest
#                   -> prod promotes it as global-payments-prod-latest (manual, gated)
#
# The version number N comes from the dev build and travels unchanged, so one number identifies
# one artifact in every environment.
#
# Two roles are needed because the image and the service live in different accounts:
#   ecr_role_arn -> prod account, used to push the image (all environments)
#   role_arn     -> the environment's own account, used to roll ECS
# dev/sandbox ECS pull the image cross-account; the repository policy and the task-exec role
# policies for that are already applied.
#
# Tags are MOVING (-latest per environment). A deploy re-points the tag; the digest it moved
# off goes untagged and the repo's 7-day lifecycle rule deletes it.
#
# Because the tag is fixed rather than moving, `force-new-deployment` can no longer pick up a
# new image — it would just re-pull the same tag. The deploy step therefore registers a new
# task-definition revision carrying the new image and points the service at it.
# NOTE: this needs `ignore_task_definition_changes = true` on the service in infrastructure-v2,
# otherwise the next terragrunt apply reverts the image. Pending Vikas (decision #23).
#
# The approval gate is enforced by GitHub Environments: only environment=production carries
# required reviewers. Auth is OIDC only (no static keys).

name: _deploy

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }            # dev | sandbox | production
      aws_region:  { type: string, required: true }            # region of the ECS service
      role_arn:    { type: string, required: true }            # environment's ECS deploy role
      ecr_role_arn: { type: string, required: true }           # prod-account role used to push
      registry:    { type: string, required: true }            # prod account ECR registry
      ecr_repo:    { type: string, required: true }            # shared repo: tpp-global-payments
      ecr_region:  { type: string, required: false, default: 'us-east-1' }
      image_tag:   { type: string, required: true }            # global-payments-<env>-1.0.0.<n>
      promote_from_tag: { type: string, required: false, default: '' }  # set => promote, don't build
      base_image:  { type: string, required: false, default: '' }   # optional Docker build-arg
      ecs_cluster: { type: string, required: false, default: '' }   # empty => skip ECS deploy
      ecs_service: { type: string, required: false, default: '' }

jobs:
  deploy:
    # amd64 runner with a genuine multi-arch build: X86_64 in dev/sandbox, ARM64 in prod, so both
    # platforms are required. The arm64 half is QEMU-emulated and can rarely deadlock (a sibling
    # repo's build hung ~6h on 2026-07-31 and died at GitHub's job ceiling.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment == 'production' && 'production' || '' }}
    concurrency:
      group: deploy-${{ inputs.environment }}-${{ github.repository }}
    permissions:
      id-token: write   # OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.promote_from_tag == '' }}

      - name: Set up QEMU (enables the arm64 build on the amd64 runner)
        if: ${{ inputs.promote_from_tag == '' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx (for --push straight to ECR)
        if: ${{ inputs.promote_from_tag == '' }}
        uses: docker/setup-buildx-action@v3

      # ---- push phase: prod account ------------------------------------------------
      - name: Configure AWS credentials for ECR push (prod account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.ecr_role_arn }}
          aws-region: ${{ inputs.ecr_region }}

      - name: Confirm push identity
        run: aws sts get-caller-identity

      - name: Log in to the shared ECR
        if: ${{ inputs.promote_from_tag == '' }}
        uses: aws-actions/amazon-ecr-login@v2

      # ---- promote path: no build, no image transfer ------------------------------
      # Re-points the destination tag at the digest the source tag holds, by re-putting the
      # manifest under that name. The manifest is copied verbatim, so a multi-arch index keeps
      # both architectures — pulling and re-pushing would flatten it.
      - name: Promote ${{ inputs.promote_from_tag }} -> ${{ inputs.image_tag }}
        if: ${{ inputs.promote_from_tag != '' }}
        run: |
          set -euo pipefail
          REPO="${{ inputs.ecr_repo }}"
          REGION="${{ inputs.ecr_region }}"

          aws ecr batch-get-image --region "$REGION" --repository-name "$REPO" \
            --image-ids imageTag="${{ inputs.promote_from_tag }}" \
            --accepted-media-types \
              "application/vnd.oci.image.index.v1+json" \
              "application/vnd.docker.distribution.manifest.list.v2+json" \
              "application/vnd.oci.image.manifest.v1+json" \
              "application/vnd.docker.distribution.manifest.v2+json" \
            --output json > got.json

          jq -e '.images[0]' got.json >/dev/null \
            || { echo "source tag ${{ inputs.promote_from_tag }} not found in $REPO"; exit 1; }

          # -j, not -r: a digest is a hash of the manifest's exact bytes, and -r appends a
          # trailing newline. ECR would accept the altered bytes and store a NEW image rather
          # than a second tag on the existing one, quietly breaking the same-artifact guarantee.
          jq -j '.images[0].imageManifest' got.json > manifest.json
          MEDIA=$(jq -r '.images[0].imageManifestMediaType' got.json)
          SRC_DIGEST=$(jq -r '.images[0].imageId.imageDigest' got.json)
          echo "source $REPO:${{ inputs.promote_from_tag }} = $SRC_DIGEST ($MEDIA)"

          # Moving tags: if the destination already points at this digest it is a re-run —
          # nothing to move. Any other digest gets re-pointed (the repo is mutable).
          CUR=$(aws ecr batch-get-image --region "$REGION" --repository-name "$REPO" \
            --image-ids imageTag="${{ inputs.image_tag }}" \
            --query 'images[0].imageId.imageDigest' --output text 2>/dev/null || true)
          if [ "$CUR" = "$SRC_DIGEST" ]; then
            echo "${{ inputs.image_tag }} already points at $SRC_DIGEST — nothing to move."
            exit 0
          fi

          aws ecr put-image --region "$REGION" --repository-name "$REPO" \
            --image-tag "${{ inputs.image_tag }}" \
            --image-manifest file://manifest.json \
            --image-manifest-media-type "$MEDIA" >/dev/null

          NEW_DIGEST=$(aws ecr batch-get-image --region "$REGION" --repository-name "$REPO" \
            --image-ids imageTag="${{ inputs.image_tag }}" \
            --query 'images[0].imageId.imageDigest' --output text)
          echo "promoted to ${{ inputs.image_tag }} = $NEW_DIGEST"
          [ "$NEW_DIGEST" = "$SRC_DIGEST" ] \
            || { echo "MISMATCH: promotion produced a different digest"; exit 1; }
          echo "Same digest — the promoted image is the artifact that was tested."

      # ---- build path: only when nothing is being promoted -------------------------
      - name: Build & push (multi-arch amd64+arm64; ${{ inputs.image_tag }})
        if: ${{ inputs.promote_from_tag == '' }}
        run: |
          set -euo pipefail
          IMG="${{ inputs.registry }}/${{ inputs.ecr_repo }}"
          BASE_ARG=""
          if [ -n "${{ inputs.base_image }}" ]; then
            BASE_ARG="--build-arg BASE_IMAGE=${{ inputs.base_image }}"
          fi
          docker buildx build . \
            --platform=linux/amd64,linux/arm64 $BASE_ARG \
            --provenance=false \
            -t "$IMG:${{ inputs.image_tag }}" \
            --push

      - name: Record the pushed digest
        if: ${{ inputs.promote_from_tag == '' }}
        # batch-get-image, not describe-images: prod-deploy-payments-role can push and read
        # manifests but has no ecr:DescribeImages, so describe-images fails with AccessDenied.
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr batch-get-image \
            --region "${{ inputs.ecr_region }}" \
            --repository-name "${{ inputs.ecr_repo }}" \
            --image-ids imageTag="${{ inputs.image_tag }}" \
            --query 'images[0].imageId.imageDigest' --output text)
          echo "Pushed ${{ inputs.ecr_repo }}:${{ inputs.image_tag }} => $DIGEST"

      # ---- deploy phase: the environment's own account -----------------------------
      - name: Configure AWS credentials for ECS deploy (target account)
        if: ${{ inputs.ecs_cluster != '' && inputs.ecs_service != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Deploy to ECS (register a new task-def revision, then roll)
        if: ${{ inputs.ecs_cluster != '' && inputs.ecs_service != '' }}
        env:
          CLUSTER: ${{ inputs.ecs_cluster }}
          SERVICE: ${{ inputs.ecs_service }}
          REGION:  ${{ inputs.aws_region }}
          NEW_IMAGE: ${{ inputs.registry }}/${{ inputs.ecr_repo }}:${{ inputs.image_tag }}
          # Datadog version/build-number source (ITPP-422) - via env, not inline, to avoid script
          # injection (SonarQube S7630).
          IMAGE_TAG: ${{ inputs.image_tag }}
          PROMOTE_FROM_TAG: ${{ inputs.promote_from_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          echo "== $SERVICE on $CLUSTER -> $NEW_IMAGE =="

          # Base the new revision on the FAMILY'S latest ACTIVE revision, not the revision the
          # service happens to be running. Terraform registers config changes (memory, env vars)
          # as new revisions the service never points at while CI owns task_definition; building
          # on the running revision would strand those changes forever. Family-latest picks them
          # up on the next deploy, which is the standard render-and-register pattern.
          RUNNING_TD=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
            --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
          FAMILY=$(aws ecs describe-task-definition --region "$REGION" \
            --task-definition "$RUNNING_TD" --query 'taskDefinition.family' --output text)
          aws ecs describe-task-definition --region "$REGION" --task-definition "$FAMILY" \
            --query 'taskDefinition' > td.json

          # Drift is legitimate (a fresh Terraform config change) but can also be a manual
          # registration or a post-rollback leftover — surface it either way.
          LATEST_TD=$(jq -r '"\(.family):\(.revision)"' td.json)
          if [ "${RUNNING_TD##*/}" != "$LATEST_TD" ]; then
            echo "::warning::DRIFT: service runs ${RUNNING_TD##*/} but family latest is $LATEST_TD — basing on latest"
          fi

          # The load-balanced container is the service's primary one. Some services also run a
          # task-lifetime sidecar built from the SAME image, so every container currently using
          # the primary's image is updated together; sidecars on other images (the log router)
          # are left alone.
          PRIMARY=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
            --services "$SERVICE" --query 'services[0].loadBalancers[0].containerName' --output text)
          OLD_IMAGE=$(jq -r --arg C "$PRIMARY" \
            '.containerDefinitions[] | select(.name==$C) | .image' td.json)
          echo "primary container=$PRIMARY  old image=$OLD_IMAGE"

          # Datadog version + build number (ITPP-422). Source the number from the tag being deployed
          # (promote source if promoting, else the built image tag): its trailing digits, falling
          # back to this run's number if the tag has no numeric suffix (e.g. *-latest). So DD_VERSION
          # is always 1.0.0.<digits>; version-shaped, swaps to real semver at ITPP-312. buildnumber is
          # merged into DD_TAGS (keeps Terraform's app:tpp, stale buildnumber stripped so no accumulation).
          SRC_TAG="${PROMOTE_FROM_TAG:-$IMAGE_TAG}"
          BUILD_NUMBER="${SRC_TAG##*.}"
          case "$BUILD_NUMBER" in ''|*[!0-9]*) BUILD_NUMBER="$RUN_NUMBER" ;; esac
          DD_VERSION="1.0.0.${BUILD_NUMBER}"
          echo "DD_VERSION=$DD_VERSION  buildnumber=$BUILD_NUMBER"

          # Drop the read-only fields describe-task-definition returns; register the rest.
          jq --arg OLD "$OLD_IMAGE" --arg NEW "$NEW_IMAGE" \
             --arg PRIMARY "$PRIMARY" --arg VER "$DD_VERSION" --arg BN "$BUILD_NUMBER" \
            '.containerDefinitions |= map(
               (if .image == $OLD then .image = $NEW else . end)
               | if (.name == $PRIMARY or .name == "datadog-agent") then
                   .environment = (
                     [ (.environment // [])[] | select(.name != "DD_VERSION") ]
                     | map(if .name == "DD_TAGS"
                           then .value = (((.value | split(",")
                                            | map(select(startswith("buildnumber:") | not)))
                                           + ["buildnumber:" + $BN]) | join(","))
                           else . end)
                   ) + [ {name: "DD_VERSION", value: $VER} ]
                 else . end)
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            td.json > td-new.json

          NEW_TD=$(aws ecs register-task-definition --region "$REGION" \
            --cli-input-json file://td-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered $NEW_TD"

          aws ecs update-service --region "$REGION" --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_TD" >/dev/null

          STATE=""
          for i in $(seq 1 60); do
            STATE=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
              --services "$SERVICE" --query 'services[0].deployments[0].rolloutState' --output text)
            echo "  [$i/60] rolloutState=$STATE"
            [ "$STATE" = "COMPLETED" ] && break
            [ "$STATE" = "FAILED" ] && { echo "rollout FAILED"; exit 1; }
            sleep 30
          done
          [ "$STATE" = "COMPLETED" ] || { echo "timed out after 30 min"; exit 1; }

          # A COMPLETED rollout is not proof the new revision is live — a circuit-breaker
          # rollback also reports COMPLETED. Assert the primary deployment is our revision.
          LIVE_TD=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" --output text)
          echo "live task definition = $LIVE_TD"
          [ "$LIVE_TD" = "$NEW_TD" ] || { echo "ROLLED BACK: live is $LIVE_TD, expected $NEW_TD"; exit 1; }
          echo "$SERVICE is live on $NEW_TD (image $NEW_IMAGE)"
