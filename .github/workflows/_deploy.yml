# Builds (or promotes) one image in the shared tpp-global-payments repo (prod account) and rolls the ECS service.
# Version tags (<env>-1.0.0.N) are write-once; -latest style tags still move.

name: _deploy

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }            # dev | sandbox | production
      aws_region:  { type: string, required: true }            # region of the ECS service
      role_arn:    { type: string, required: true }            # environment ECS deploy role
      ecr_role_arn: { type: string, required: true }           # prod-account role used to push
      registry:    { type: string, required: true }            # prod account ECR registry
      ecr_repo:    { type: string, required: true }            # shared repo: tpp-global-payments
      ecr_region:  { type: string, required: false, default: 'us-east-1' }
      image_tag:   { type: string, required: true }            # global-payments-<env>-1.0.0.<n>
      extra_tags:  { type: string, required: false, default: '' }  # comma-separated, build only
      labels:      { type: string, required: false, default: '' }  # comma-separated key=value, build only
      promote_from_tag: { type: string, required: false, default: '' }  # set => promote, don't build
      base_image:  { type: string, required: false, default: '' }   # optional Docker build-arg
      ecs_cluster: { type: string, required: false, default: '' }
      ecs_service: { type: string, required: false, default: '' }
      checkout_ref: { type: string, required: false, default: '' }  # empty => the dispatched commit
      security_gate: { type: boolean, required: false, default: true }

jobs:
  deploy:
    name: ${{ inputs.promote_from_tag == '' && 'Build and roll out' || inputs.promote_from_tag == inputs.image_tag && 'Roll out' || 'Retag and roll out' }}
    # Multi-arch: X86_64 in dev/qa/sandbox, ARM64 in prod. The arm64 half is QEMU-emulated and can rarely hang.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment == 'production' && 'production' || '' }}
    concurrency:
      group: global-payments-deploy-${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      checks: read
      pull-requests: read
    steps:
      # Dev only warns; sandbox and production stop here unless the commit's PR passed the Mend App security check.
      - name: Security gate (PR checks of this commit)
        if: ${{ inputs.security_gate }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request

          repo, commit, env = os.environ["REPO"], os.environ["COMMIT"], os.environ["DEPLOY_ENV"]
          enforce = env != "dev"
          required = ("Mend Security Check",)

          def get(path):
              req = urllib.request.Request("https://api.github.com/repos/%s/%s" % (repo, path), headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              return json.load(urllib.request.urlopen(req, timeout=30))

          def verdict():
              pulls = [p for p in get("commits/%s/pulls" % commit) if p["merged_at"] or p["head"]["sha"] == commit]
              if not pulls:
                  return None, "no pull request found for %s" % commit[:8]
              pr = pulls[0]
              runs = get("commits/%s/check-runs?per_page=100" % pr["head"]["sha"])["check_runs"]
              latest = {}
              for r in sorted(runs, key=lambda r: r.get("started_at") or ""):
                  latest[r["name"]] = r
              bad = ["%s=%s" % (n, latest[n]["conclusion"] if n in latest else "missing")
                     for n in required if n not in latest or latest[n]["conclusion"] not in ("success", "neutral")]
              return pr["number"], ", ".join(bad)

          pr, problem = verdict()
          scope = "PR #%s" % pr if pr else "commit %s" % commit[:8]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### Security gate (%s): %s\n\n%s\n" % (
                  env, "passed" if not problem else ("BLOCKED" if enforce else "warning"),
                  "%s: %s" % (scope, problem or "Mend Security Check passed")))
          if not problem:
              print("Security gate passed: %s has Mend Security Check green" % scope)
          elif enforce:
              sys.exit("::error::Security gate blocked the %s build: %s (%s)" % (env, problem, scope))
          else:
              print("::warning::Security gate (dev, warn only): %s (%s)" % (problem, scope))
          PY

      - uses: actions/checkout@v4
        if: ${{ inputs.promote_from_tag == '' }}
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up QEMU (enables the arm64 build on the amd64 runner)
        if: ${{ inputs.promote_from_tag == '' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ inputs.promote_from_tag == '' }}
        uses: docker/setup-buildx-action@v3

      # ---- push phase: prod account ------------------------------------------------
      - name: Configure AWS credentials for ECR push (prod account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.ecr_role_arn }}
          aws-region: ${{ inputs.ecr_region }}

      - name: Confirm push identity
        run: aws sts get-caller-identity

      - name: Log in to the shared ECR
        if: ${{ inputs.promote_from_tag == '' }}
        uses: aws-actions/amazon-ecr-login@v2

      # ---- promote path: no build, no image transfer ------------------------------
      # Re-points the destination tag at the digest the source tag holds, by re-putting the
      # manifest under that name. The manifest is copied verbatim, so a multi-arch index keeps
      # both architectures — pulling and re-pushing would flatten it.
      - name: Promote ${{ inputs.promote_from_tag }} -> ${{ inputs.image_tag }}
        if: ${{ inputs.promote_from_tag != '' }}
        env:
          ECR_REPO: ${{ inputs.ecr_repo }}
          ECR_REGION: ${{ inputs.ecr_region }}
          PROMOTE_FROM_TAG: ${{ inputs.promote_from_tag }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          REPO="${ECR_REPO}"
          REGION="${ECR_REGION}"

          aws ecr batch-get-image --region "$REGION" --repository-name "$REPO" \
            --image-ids imageTag="${PROMOTE_FROM_TAG}" \
            --accepted-media-types \
              "application/vnd.oci.image.index.v1+json" \
              "application/vnd.docker.distribution.manifest.list.v2+json" \
              "application/vnd.oci.image.manifest.v1+json" \
              "application/vnd.docker.distribution.manifest.v2+json" \
            --output json > got.json

          jq -e '.images[0]' got.json >/dev/null \
            || { echo "source tag ${PROMOTE_FROM_TAG} not found in $REPO"; exit 1; }

          # -j, not -r: a digest is a hash of the manifest's exact bytes, and -r appends a
          # trailing newline. ECR would accept the altered bytes and store a NEW image rather
          # than a second tag on the existing one, quietly breaking the same-artifact guarantee.
          jq -j '.images[0].imageManifest' got.json > manifest.json
          MEDIA=$(jq -r '.images[0].imageManifestMediaType' got.json)
          SRC_DIGEST=$(jq -r '.images[0].imageId.imageDigest' got.json)
          echo "source $REPO:${PROMOTE_FROM_TAG} = $SRC_DIGEST ($MEDIA)"

          # If the destination already points at this digest it is a re-run, nothing to move.
          # -latest style tags get re-pointed; 1.0.0.N tags never move to another image.
          CUR=$(aws ecr batch-get-image --region "$REGION" --repository-name "$REPO" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'images[0].imageId.imageDigest' --output text 2>/dev/null || true)
          VERSIONED=$([[ "$IMAGE_TAG" =~ -1\.0\.0\.[0-9]+$ ]] && echo yes || true)
          # Checked here, not only in the plan, because "Re-run failed jobs" skips the plan. Rollback promotes a tag onto itself.
          if [ -n "$VERSIONED" ] && [ "$PROMOTE_FROM_TAG" != "$IMAGE_TAG" ]; then
            ROLLED=$(aws ecr list-images --region "$REGION" --repository-name "$REPO" --filter tagStatus=TAGGED \
              --query "imageIds[?imageDigest=='$SRC_DIGEST'].imageTag" --output text | tr '\t' '\n' | grep -- '-rolledback-' || true)
            [ -z "$ROLLED" ] || { echo "::error::This image was rolled back ($ROLLED). Push a fix and start a new run."; exit 1; }
          fi
          if [ "$CUR" = "$SRC_DIGEST" ]; then
            echo "${IMAGE_TAG} already points at $SRC_DIGEST — nothing to move."
            exit 0
          fi
          if [ -n "$VERSIONED" ] && [ -n "$CUR" ] && [ "$CUR" != "None" ]; then
            echo "::error::${IMAGE_TAG} already belongs to another image ($CUR). Version numbers never move; start a new run."
            exit 1
          fi

          aws ecr put-image --region "$REGION" --repository-name "$REPO" \
            --image-tag "${IMAGE_TAG}" \
            --image-manifest file://manifest.json \
            --image-manifest-media-type "$MEDIA" >/dev/null

          NEW_DIGEST=$(aws ecr batch-get-image --region "$REGION" --repository-name "$REPO" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'images[0].imageId.imageDigest' --output text)
          echo "promoted to ${IMAGE_TAG} = $NEW_DIGEST"
          [ "$NEW_DIGEST" = "$SRC_DIGEST" ] \
            || { echo "MISMATCH: promotion produced a different digest"; exit 1; }
          echo "Same digest — the promoted image is the artifact that was tested."

      # ---- build path: only when nothing is being promoted -------------------------
      - name: Build & push (multi-arch amd64+arm64; ${{ inputs.image_tag }})
        if: ${{ inputs.promote_from_tag == '' }}
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.ecr_repo }}
          BASE_IMAGE: ${{ inputs.base_image }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          EXTRA_TAGS: ${{ inputs.extra_tags }}
          LABELS: ${{ inputs.labels }}
        run: |
          set -euo pipefail
          ARGS=(-t "$IMAGE:$IMAGE_TAG")
          IFS=, read -ra T <<<"$EXTRA_TAGS"; for t in "${T[@]}"; do ARGS+=(-t "$IMAGE:$t"); done
          IFS=, read -ra L <<<"$LABELS"; for l in "${L[@]}"; do ARGS+=(--label "$l"); done
          [ -z "$BASE_IMAGE" ] || ARGS+=(--build-arg "BASE_IMAGE=$BASE_IMAGE")
          docker buildx build . --platform=linux/amd64,linux/arm64 --provenance=false "${ARGS[@]}" --push

      - name: Record the pushed digest
        if: ${{ inputs.promote_from_tag == '' }}
        env:
          ECR_REPO: ${{ inputs.ecr_repo }}
          ECR_REGION: ${{ inputs.ecr_region }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          REPO="${ECR_REPO}"
          # batch-get-image, not describe-images: prod-deploy-payments-role can push and read
          # manifests but has no ecr:DescribeImages, so describe-images fails with AccessDenied.
          DIGEST=$(aws ecr batch-get-image \
            --region "${ECR_REGION}" \
            --repository-name "$REPO" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'images[0].imageId.imageDigest' --output text)
          echo "Pushed $REPO:${IMAGE_TAG} => $DIGEST"

      # ---- deploy phase: the environment own account --------------------------------
      - name: Configure AWS credentials for ECS deploy (target account)
        if: ${{ inputs.ecs_cluster != '' && inputs.ecs_service != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      # A late "Re-run failed jobs" skips the plan, so the older-over-newer check is repeated here. Rollback is exempt.
      - name: Refuse an older version over a newer one
        if: ${{ inputs.ecs_cluster != '' && inputs.ecs_service != '' && inputs.promote_from_tag != inputs.image_tag }}
        env:
          CLUSTER: ${{ inputs.ecs_cluster }}
          SERVICE: ${{ inputs.ecs_service }}
          REGION:  ${{ inputs.aws_region }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ -1\.0\.0\.([0-9]+)$ ]] || exit 0
          NEW_N="${BASH_REMATCH[1]}"
          RUNNING_TD=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
            --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
          PRIMARY=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
            --services "$SERVICE" --query 'services[0].loadBalancers[0].containerName' --output text)
          RUNNING_IMAGE=$(aws ecs describe-task-definition --region "$REGION" --task-definition "$RUNNING_TD" \
            --query "taskDefinition.containerDefinitions[?name=='$PRIMARY'].image | [0]" --output text)
          echo "running $RUNNING_IMAGE, deploying 1.0.0.$NEW_N"
          if [[ "$RUNNING_IMAGE" =~ -1\.0\.0\.([0-9]+)$ ]] && [ "${BASH_REMATCH[1]}" -gt "$NEW_N" ]; then
            echo "::error::$SERVICE already runs 1.0.0.${BASH_REMATCH[1]}, newer than 1.0.0.$NEW_N. Start a new run, or use rollback to go back."
            exit 1
          fi

      - name: Deploy to ECS (register a new task-def revision, then roll)
        id: rollout
        if: ${{ inputs.ecs_cluster != '' && inputs.ecs_service != '' }}
        env:
          CLUSTER: ${{ inputs.ecs_cluster }}
          SERVICE: ${{ inputs.ecs_service }}
          REGION:  ${{ inputs.aws_region }}
          NEW_IMAGE: ${{ inputs.registry }}/${{ inputs.ecr_repo }}:${{ inputs.image_tag }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          echo "== $SERVICE on $CLUSTER -> $NEW_IMAGE =="

          # Released images carry 1.0.0.N from QA on; dev and feature images show their branch and commit.
          if [[ "$IMAGE_TAG" =~ -1\.0\.0\.([0-9]+)$ ]]; then
            BUILD_NUMBER="${BASH_REMATCH[1]}"; DD_VERSION="1.0.0.$BUILD_NUMBER"
          else
            BUILD_NUMBER="$RUN_NUMBER"; DD_VERSION=$(sed -E 's/^.*-(dev|qa)-//' <<<"$IMAGE_TAG")
          fi
          echo "Datadog version=$DD_VERSION buildnumber=$BUILD_NUMBER"

          # Base the new revision on the FAMILY'S latest ACTIVE revision, not the revision the
          # service happens to be running. Terraform registers config changes (memory, env vars)
          # as new revisions the service never points at while CI owns task_definition; building
          # on the running revision would strand those changes forever. Family-latest picks them
          # up on the next deploy, which is the standard render-and-register pattern.
          RUNNING_TD=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
            --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
          FAMILY=$(aws ecs describe-task-definition --region "$REGION" \
            --task-definition "$RUNNING_TD" --query 'taskDefinition.family' --output text)
          aws ecs describe-task-definition --region "$REGION" --task-definition "$FAMILY" \
            --query 'taskDefinition' > td.json

          # Drift is legitimate (a fresh Terraform config change) but can also be a manual
          # registration or a post-rollback leftover — surface it either way.
          LATEST_TD=$(jq -r '"\(.family):\(.revision)"' td.json)
          if [ "${RUNNING_TD##*/}" != "$LATEST_TD" ]; then
            echo "::warning::DRIFT: service runs ${RUNNING_TD##*/} but family latest is $LATEST_TD — basing on latest"
          fi

          # The load-balanced container is the primary one. Some services also run a task-lifetime
          # sidecar built from the SAME image, so every container currently using the primary
          # image is updated together; sidecars on other images (the log router) are left alone.
          PRIMARY=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
            --services "$SERVICE" --query 'services[0].loadBalancers[0].containerName' --output text)
          OLD_IMAGE=$(jq -r --arg C "$PRIMARY" \
            '.containerDefinitions[] | select(.name==$C) | .image' td.json)
          echo "primary container=$PRIMARY  old image=$OLD_IMAGE"

          # DD_TAGS stays space-separated, as Terraform writes it.
          jq --arg OLD "$OLD_IMAGE" --arg NEW "$NEW_IMAGE" \
             --arg PRIMARY "$PRIMARY" --arg VER "$DD_VERSION" --arg BN "$BUILD_NUMBER" \
            '.containerDefinitions |= map(
               (if .image == $OLD then .image = $NEW else . end)
               | if (.name == $PRIMARY or .name == "datadog-agent") then
                   .environment = ([ (.environment // [])[] | select(.name != "DD_VERSION")
                     | if .name == "DD_TAGS" then .value = ([ .value | splits("[ ,]+") ]
                         | map(select(length > 0 and (startswith("buildnumber:") | not)))
                         | . + ["buildnumber:" + $BN] | join(" ")) else . end ]
                     + [ {name: "DD_VERSION", value: $VER} ])
                 else . end)
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            td.json > td-new.json

          NEW_TD=$(aws ecs register-task-definition --region "$REGION" \
            --cli-input-json file://td-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered $NEW_TD"

          aws ecs update-service --region "$REGION" --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_TD" >/dev/null

          STATE=""
          for i in $(seq 1 60); do
            STATE=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
              --services "$SERVICE" --query 'services[0].deployments[0].rolloutState' --output text)
            echo "  [$i/60] rolloutState=$STATE"
            [ "$STATE" = "COMPLETED" ] && break
            [ "$STATE" = "FAILED" ] && { echo "rollout FAILED"; exit 1; }
            sleep 30
          done
          [ "$STATE" = "COMPLETED" ] || { echo "timed out after 30 min"; exit 1; }

          # A COMPLETED rollout is not proof the new revision is live — a circuit-breaker
          # rollback also reports COMPLETED. Assert the primary deployment is our revision.
          LIVE_TD=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" --output text)
          echo "live task definition = $LIVE_TD"
          [ "$LIVE_TD" = "$NEW_TD" ] || { echo "ROLLED BACK: live is $LIVE_TD, expected $NEW_TD"; exit 1; }
          echo "$SERVICE is live on $NEW_TD (image $NEW_IMAGE)"

      - name: Configure AWS credentials to mark a failed rollout (prod account)
        if: ${{ always() && (steps.rollout.outcome == 'failure' || steps.rollout.outcome == 'cancelled') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.ecr_role_arn }}
          aws-region: ${{ inputs.ecr_region }}

      # The version tag was written before the rollout; the mark lets rollback skip a version that never ran here.
      - name: Mark the version whose rollout failed
        if: ${{ always() && (steps.rollout.outcome == 'failure' || steps.rollout.outcome == 'cancelled') }}
        env:
          ECR_REPO: ${{ inputs.ecr_repo }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ECR_REGION: ${{ inputs.ecr_region }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^(.+)-1\.0\.0\.([0-9]+)$ ]] || { echo "not a version tag, nothing to mark"; exit 0; }
          MARK="${BASH_REMATCH[1]}-failed-1.0.0.${BASH_REMATCH[2]}"
          REPO="${ECR_REPO}"
          aws ecr batch-get-image --region "$ECR_REGION" --repository-name "$REPO" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --accepted-media-types \
              "application/vnd.oci.image.index.v1+json" \
              "application/vnd.docker.distribution.manifest.list.v2+json" \
              "application/vnd.oci.image.manifest.v1+json" \
              "application/vnd.docker.distribution.manifest.v2+json" \
            --output json > mark.json
          SRC=$(jq -r '.images[0].imageId.imageDigest' mark.json)
          CUR=$(aws ecr batch-get-image --region "$ECR_REGION" --repository-name "$REPO" \
            --image-ids imageTag="$MARK" --query 'images[0].imageId.imageDigest' --output text 2>/dev/null || true)
          [ "$CUR" != "$SRC" ] || { echo "$MARK already set"; exit 0; }
          jq -j '.images[0].imageManifest' mark.json > mark-manifest.json
          aws ecr put-image --region "$ECR_REGION" --repository-name "$REPO" --image-tag "$MARK" \
            --image-manifest file://mark-manifest.json \
            --image-manifest-media-type "$(jq -r '.images[0].imageManifestMediaType' mark.json)" >/dev/null
          echo "::warning::Rollout of ${IMAGE_TAG} did not finish; marked $MARK so rollback skips it"
