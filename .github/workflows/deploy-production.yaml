# globalpayments-python-service — deploy to Production (TPP account, us-east-1). Manual only, gated.
# Pauses at the 'production' Environment's required reviewers before anything runs.
#
# Prod builds its own image from the dispatched branch (normally main) and re-points
# global-payments-prod-latest at it. There is no promote from sandbox, so prod runs its own
# build of the same source rather than the sandbox-tested bytes.
name: deploy-production

on:
  workflow_dispatch: {}

run-name: Deploy global-payments to production (build from ${{ github.ref_name }})

permissions:
  id-token: write
  contents: read

jobs:
  production:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      aws_region:  us-east-1
      role_arn:    ${{ vars.PROD_ROLE_ARN }}
      ecr_role_arn: ${{ vars.PROD_ROLE_ARN }}      # prod-deploy-payments-role: pushes for every env (decision #17)
      registry:    ${{ vars.PROD_REGISTRY }}       # shared repos live in the prod account
      ecr_repo:    tpp-global-payments
      image_tag:   global-payments-prod-latest
      ecs_cluster: tpp-prod-ecs-cluster
      ecs_service: tpp-prod-global-payments-service
