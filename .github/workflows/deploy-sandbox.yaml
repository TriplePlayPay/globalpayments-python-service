# globalpayments-python-service — promote to Sandbox. Runs once deploy-develop succeeds.
#
# This does NOT build. It adds a sandbox tag to the image dev just produced, so sandbox runs the
# exact artifact dev ran rather than a rebuild of the same commit.
# workflow_run only fires for workflows on the default branch, so this is first proven after merge.
name: deploy-sandbox

on:
  workflow_run:
    workflows: [ deploy-develop ]
    types: [ completed ]

permissions:
  id-token: write
  contents: read

jobs:
  sandbox:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: sandbox
      aws_region:  us-east-2
      role_arn:    ${{ vars.SANDBOX_ROLE_ARN }}
      ecr_role_arn: ${{ vars.PROD_ROLE_ARN }}      # prod-deploy-payments-role: pushes for every env (decision #17)
      registry:    ${{ vars.PROD_REGISTRY }}       # shared repos live in the prod account
      ecr_repo:    tpp-global-payments
      promote_from_tag: global-payments-dev-latest
      image_tag:        global-payments-sandbox-latest
      ecs_cluster: tpp-sandbox-ecs-cluster
      ecs_service: tpp-global-payments
