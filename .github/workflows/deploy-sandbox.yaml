# globalpayments-python-service — deploy to Sandbox. Auto on push to main.
# Thin caller of the reusable _deploy.yml.
#
# The image goes to the shared repo in the TPP prod account; the ECS service it rolls lives in
# the Gateway account (us-east-2) and pulls that image cross-account. Hence the two roles.
name: deploy-sandbox

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  sandbox:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: sandbox
      aws_region:  us-east-2
      role_arn:    ${{ vars.SANDBOX_ROLE_ARN }}
      ecr_role_arn: ${{ vars.PROD_ROLE_ARN }}      # prod-deploy-payments-role: pushes for every env (decision #17)
      registry:    ${{ vars.PROD_REGISTRY }}       # shared repos live in the prod account
      ecr_repo:    tpp-global-payments
      image_tag:   global-payments-sandbox-1.0.0.${{ github.run_number }}
      ecs_cluster: tpp-sandbox-ecs-cluster
      ecs_service: tpp-sandbox-global-payments-service
